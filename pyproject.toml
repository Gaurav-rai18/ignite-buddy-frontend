[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ignite-buddy"
version = "5.0.0"
description = "Ignite Buddy: Central backend with Admin Console and Trainee Assistant desktop agent."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
  "django>=5.0", "djangorestframework>=3.15", "python-dotenv>=1.0", "channels>=4.1", "daphne>=4.1",
  "django-cors-headers>=4.0", "djangorestframework-simplejwt>=5.3",
  "langchain-ollama>=1.0.0", "truststore", "rapidfuzz", "numpy", "pypdf",
  "dateparser", "Pillow", "rapidocr-onnxruntime",
  "chromadb>=0.5", "python-pptx", "python-docx", "httpx",
]
server-postgres = ["psycopg[binary]>=3.1"]            # production database (DATABASE_URL=postgresql://...)
server-redis = ["channels-redis>=4.2"]       # needed only when running more than one server process
client = ["python-dotenv>=1.0", "aiohttp>=3.9", "websocket-client", "SpeechRecognition>=3.10", "httpx", "Pillow", "mss", "psutil", "rapidfuzz", "pypdf", "pynput; sys_platform != 'win32'"]
desktop = ["PySide6>=6.6"]                                    # the overlay shell (ignite-desktop)
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
ignite-server = "server.run:main"
ignite-client = "client.agent.server:main"
ignite-desktop = "client.desktop.launcher:main"
ignite-kb = "server.knowledge.cli:main"
ignite-doctor = "server.doctor:main"
trainee-server = "server.run:main"
trainee-kb = "server.knowledge.cli:main"
trainee-doctor = "server.doctor:main"
trainee-desktop = "client.desktop.launcher:main"
trainee-desktop-qt = "client.desktop.launcher:main_qt"
trainee-desktop-electron = "client.desktop.launcher:main_electron"
trainee-agent = "client.agent.server:main"
trainee-cli = "client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:langsmith_plugin"
